<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Layer one of the network isolation (DESIGN.md §8.3). 'self' is the virtual host the shell is
     served from, which is the only place a script, a stylesheet or a font may come from; nothing
     may be fetched. 'wasm-unsafe-eval' lets the Graphviz WebAssembly module instantiate and
     enables nothing else; plain eval stays blocked. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src data:; font-src 'self'; connect-src 'none'">
<title>Md2OneNote diagram shell</title>
<link rel="stylesheet" href="katex.min.css">
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; overflow: hidden; }
  #c { display: inline-block; }
  #c svg { display: block; max-width: none !important; }
  /* Display math. KaTeX centres it in a full-width block with a 1em margin; here the box is
     the picture, so it hugs the formula with a little air for overhanging glyphs. */
  #c .math { display: inline-block; padding: 4px 8px; font-size: 18px; color: #000000; white-space: nowrap; }
  #c .math .katex-display { margin: 0; }
</style>
</head>
<body>
<div id="c"></div>
<script src="mermaid.min.js"></script>
<script src="viz-global.js"></script>
<script src="katex.min.js"></script>
<script>
  // htmlLabels:false is mandatory: foreignObject content does not rasterize reliably
  // (IMPLEMENTATION.md §8.2). securityLevel:'strict' keeps diagram text from becoming markup.
  mermaid.initialize({
    startOnLoad: false,
    htmlLabels: false,
    securityLevel: 'strict',
    theme: 'default',
    flowchart: { htmlLabels: false },
    fontFamily: 'Calibri, "Segoe UI", sans-serif'
  });

  var renderCount = 0;

  // Graphviz is a WebAssembly module inside viz-global.js; instantiating it costs a moment, so
  // it happens on the first Graphviz diagram and the instance serves the rest of the import.
  var graphviz = null;

  function post(message) {
    window.chrome.webview.postMessage(JSON.stringify(message));
  }

  // Each render starts from an empty container, so no diagram can observe or corrupt a previous
  // one (NFR-6). The reply always carries the id it was asked with; the host matches on it.
  async function renderDiagram(lang, source, id) {
    try {
      var container = document.getElementById('c');
      container.innerHTML = '';

      var size;
      switch (lang) {
        case 'mermaid':
          size = await renderMermaid(container, source);
          break;
        case 'dot':
        case 'graphviz':
          size = await renderGraphviz(container, source);
          break;
        case 'math':
        case 'katex':
          size = await renderMath(container, source);
          break;
        default:
          throw new Error('unsupported diagram language: ' + lang);
      }

      post({ id: id, ok: true, w: size.w, h: size.h });
    } catch (e) {
      post({ id: id, ok: false, error: String(e && e.message ? e.message : e) });
    }
  }

  async function renderMermaid(container, source) {
    var result = await mermaid.render('m' + (++renderCount), source);
    container.innerHTML = result.svg;
    return pinSvg(container.querySelector('svg'));
  }

  async function renderGraphviz(container, source) {
    if (!graphviz) {
      graphviz = await Viz.instance();
    }

    // Throws with Graphviz's own message ("syntax error in line 1 near ...") when the source is
    // not DOT. The dot engine is the default; a graph can pick another with its layout attribute.
    var svg = graphviz.renderSVGElement(source, { engine: 'dot' });
    container.appendChild(svg);
    return pinSvg(svg);
  }

  async function renderMath(container, source) {
    var box = document.createElement('div');
    box.className = 'math';
    container.appendChild(box);

    // throwOnError: a formula KaTeX cannot parse is reported, not drawn with a red word in it.
    // trust stays off, so \url, \href and \includegraphics are refused (DESIGN.md §9).
    katex.render(source, box, { displayMode: true, throwOnError: true, strict: 'ignore', trust: false, output: 'html' });

    // KaTeX's fonts load on first use from the shell's own folder. Measured before they arrive,
    // the box has the fallback font's metrics and the capture shows the fallback font.
    box.getBoundingClientRect();
    await document.fonts.ready;

    var rect = box.getBoundingClientRect();
    var w = Math.ceil(rect.width);
    var h = Math.ceil(rect.height);
    if (!(w > 0 && h > 0)) {
      throw new Error('the formula has no size');
    }

    box.style.width = w + 'px';
    box.style.height = h + 'px';
    return { w: w, h: h };
  }

  // The natural size of an SVG, and the SVG pinned to it so that neither the viewport nor a
  // later resize of the host reflows the drawing.
  //
  // Absolute width and height attributes are the drawing's own size (Graphviz writes them in
  // points; the DOM converts to CSS pixels). Mermaid emits width="100%", so its rendered box is
  // the viewport's width, not the drawing's: measured that way, a wide sequence diagram came out
  // squeezed to the host window and OneNote stretched the small capture back up, blurred
  // (2026-09-14). For it the viewBox is the size, and the bounding box is only a fallback.
  function pinSvg(svg) {
    if (!svg) {
      throw new Error('no SVG was produced');
    }

    var PERCENTAGE = 2; // SVGLength.SVG_LENGTHTYPE_PERCENTAGE
    var w = 0;
    var h = 0;
    var width = svg.width && svg.width.baseVal;
    var height = svg.height && svg.height.baseVal;
    if (width && height
        && width.unitType !== PERCENTAGE && height.unitType !== PERCENTAGE
        && width.value > 0 && height.value > 0) {
      w = Math.ceil(width.value);
      h = Math.ceil(height.value);
    } else {
      var box = svg.viewBox && svg.viewBox.baseVal;
      if (box && box.width > 0 && box.height > 0) {
        w = Math.ceil(box.width);
        h = Math.ceil(box.height);
      } else {
        var rect = svg.getBoundingClientRect();
        w = Math.ceil(rect.width);
        h = Math.ceil(rect.height);
      }
    }
    if (!(w > 0 && h > 0)) {
      throw new Error('the diagram has no size');
    }

    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.style.width = w + 'px';
    svg.style.height = h + 'px';
    svg.style.maxWidth = 'none';
    return { w: w, h: h };
  }

  // Two frames after a resize the layout is committed and the capture is of the final drawing.
  function afterFrame(id) {
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        post({ id: id, ok: true, w: 0, h: 0 });
      });
    });
  }
</script>
</body>
</html>
